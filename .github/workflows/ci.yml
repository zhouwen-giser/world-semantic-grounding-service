name: CI

on:
  pull_request:
  push:
    branches: [main, codex/wsgs-v0.1-grounding-core]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wsgs_test
          POSTGRES_PASSWORD: wsgs_test
          POSTGRES_DB: wsgs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wsgs_test -d wsgs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://wsgs_test:wsgs_test@127.0.0.1:5432/wsgs_test
      TEST_UPGRADE_DATABASE_URL: postgresql://wsgs_test:wsgs_test@127.0.0.1:5432/wsgs_upgrade
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create isolated upgrade database
        run: |
          node --input-type=module -e "import { Pool } from 'pg'; const pool = new Pool({ connectionString: process.env.TEST_DATABASE_URL }); try { await pool.query('CREATE DATABASE wsgs_upgrade'); } finally { await pool.end(); }"
      - name: Run database and legacy upgrade regressions serially
        run: >-
          npm test -- --no-file-parallelism
          packages/runtime/src/job-store.integration.test.ts
          packages/runtime/src/migration-002.integration.test.ts
          services/grounding-api/src/production.integration.test.ts
          services/grounding-worker/src/postgres.integration.test.ts
