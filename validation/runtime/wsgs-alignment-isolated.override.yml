services:
  postgres:
    ports:
      - "127.0.0.1:${WSGS_ALIGNMENT_POSTGRES_PORT:-55572}:5432"

  grounding-api:
    environment:
      WSGS_AUTH_MODE: STATIC_TRUSTED
      WSGS_STATIC_SERVICE_PRINCIPAL_ID: ${WSGS_STATIC_SERVICE_PRINCIPAL_ID:?Set WSGS_STATIC_SERVICE_PRINCIPAL_ID}
      WSGS_STATIC_ACTOR_ID: ${WSGS_STATIC_ACTOR_ID:?Set WSGS_STATIC_ACTOR_ID}
      WSGS_STATIC_DATA_SCOPES: ${WSGS_STATIC_DATA_SCOPES:?Set WSGS_STATIC_DATA_SCOPES}
      WSGS_STATIC_DATASET_SCOPES: ${WSGS_STATIC_DATASET_SCOPES:?Set WSGS_STATIC_DATASET_SCOPES}
      WSGS_STATIC_PERMISSIONS: ${WSGS_STATIC_PERMISSIONS:-grounding.read,data:read,dataset:read}
      GOWM_SOUTHBOUND_LOCK_FILE: ""
      GOWM_SOUTHBOUND_LOCK_SHA256: ""
    secrets:
      - source: gowm_delegation_private_key
        target: gowm-delegation-private-key.pem

  grounding-worker:
    environment:
      GOWM_SOUTHBOUND_LOCK_FILE: ""
      GOWM_SOUTHBOUND_LOCK_SHA256: ""
    secrets:
      - source: gowm_delegation_private_key
        target: gowm-delegation-private-key.pem

volumes:
  wsgs-postgres-data:
    name: ${WSGS_ALIGNMENT_POSTGRES_VOLUME:?Set WSGS_ALIGNMENT_POSTGRES_VOLUME}
